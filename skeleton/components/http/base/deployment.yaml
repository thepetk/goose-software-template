apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    tad.gitops.set/image: ".spec.template.spec.containers[0].image"
    tad.gitops.get/image: ".spec.template.spec.containers[0].image"
    tad.gitops.set/replicas: ".spec.replicas"
    tad.gitops.get/replicas: ".spec.replicas"
  labels:
    app.kubernetes.io/instance: ${{ values.name }}
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: ${{ values.name }}
  name: ${{ values.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: ${{ values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: ${{ values.name }}
    spec:
      containers:
        - image: ${{ values.gooseImage }}
          name: goose-agent
          command: ["goose", "serve", "--host", "0.0.0.0", "--port", "3000"]
          env:
            - name: GOOSE_PROVIDER
              value: "${{ values.gooseProvider }}"
            - name: GOOSE_MODEL
              value: "${{ values.gooseModel }}"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "${{ values.otlpEndpoint }}"
          envFrom:
            - secretRef:
                name: ${{ values.name }}-provider-api-key
                optional: true
          ports:
            - containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
          volumeMounts:
            - name: goose-local
              mountPath: /home/goose/.local
      volumes:
        - name: goose-local
          emptyDir: {}
      restartPolicy: Always
